name: Data Pipeline - Update SQLite DB

on:
  push:
    paths:
      - "data/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-database:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # Note: sqlite3 is part of Python's standard library and does not need pip install.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run clean_and_merge script
        run: python clean_and_merge.py

      - name: Commit and push updated SQLite database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add orders.db
          if git diff --cached --quiet; then
            echo "No changes in orders.db"
          else
            git commit -m "Auto-update orders.db from data pipeline [skip ci]"
            git push
          fi
